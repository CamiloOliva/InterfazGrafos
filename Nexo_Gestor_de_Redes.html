function calcProjection(){if(!nodes.length)return {project:()=>({x:470,y:310}),unproject:()=>({x:0,y:0}),scale:20};const minX=Math.min(...nodes.map(n=>n.x)),maxX=Math.max(...nodes.map(n=>n.x)),minY=Math.min(...nodes.map(n=>n.y)),maxY=Math.max(...nodes.map(n=>n.y));const rangeX=Math.max(maxX-minX+4,14),rangeY=Math.max(maxY-minY+4,14),scale=Math.min((WIDTH-PAD*2)/rangeX,(HEIGHT-PAD*2)/rangeY);const midX=(minX+maxX)/2,midY=(minY+maxY)/2;return {scale,midX,midY,project:n=>({x:WIDTH/2+(n.x-midX)*scale,y:HEIGHT/2-(n.y-midY)*scale}),unproject:(x,y)=>({x:midX+(x-WIDTH/2)/scale,y:midY-(y-HEIGHT/2)/scale})}}
function curve(e,proj){const a=proj.project(getNode(e.from)),b=proj.project(getNode(e.to));const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1;const ux=dx/length,uy=dy/length,r=21;const sx=a.x+r*ux,sy=a.y+r*uy,ex=b.x-r*ux,ey=b.y-r*uy;const reciprocal=edges.some(o=>o.from===e.to&&o.to===e.from);const curvature=reciprocal?25:0;const perpX=-uy,perpY=ux;const mx=(sx+ex)/2+perpX*curvature,my=(sy+ey)/2+perpY*curvature;return {path:`M ${sx.toFixed(2)} ${sy.toFixed(2)} Q ${mx.toFixed(2)} ${my.toFixed(2)} ${ex.toFixed(2)} ${ey.toFixed(2)}`,mx:(sx+2*mx+ex)/4,my:(sy+2*my+ey)/4,perpX,perpY}}
function drawGraph(){const stage=$('#graph-stage');if(!stage)return;const proj=calcProjection(),activeKeys=new Set(route&&route.reachable?route.edges:[]),activeNodes=new Set(route&&route.reachable?route.path:[]);const selectedEdge=selected&&selected.kind==='edge'?selected.id:null,selectedNode=selected&&selected.kind==='node'?selected.id:null;const offsetX=panX,offsetY=panY;
 let grid='';const x0=proj.unproject(0,0).x,x1=proj.unproject(WIDTH,HEIGHT).x,y0=proj.unproject(0,HEIGHT).y,y1=proj.unproject(WIDTH,0).y;const gridStep=Math.max(1,Math.ceil(65/proj.scale));const step=gridStep<=2?2:gridStep<=5?5:gridStep<=10?10:20;
 const xstart=Math.ceil(Math.min(x0,x1)/step)*step,yStart=Math.ceil(Math.min(y0,y1)/step)*step;
 for(let x=xstart;x<=Math.max(x0,x1);x+=step){const p=proj.project({x,y:0}).x;grid+=`<line x1="${p}" y1="0" x2="${p}" y2="${HEIGHT}" stroke="#ebf0f6" stroke-width="1"/><text x="${p+4}" y="${HEIGHT-12}" fill="#bac7d5" font-size="12">${x}</text>`}
 for(let y=yStart;y<=Math.max(y0,y1);y+=step){const p=proj.project({x:0,y}).y;grid+=`<line x1="0" y1="${p}" x2="${WIDTH}" y2="${p}" stroke="#ebf0f6" stroke-width="1"/><text x="10" y="${p-5}" fill="#bac7d5" font-size="12">${y}</text>`}
 const origin=proj.project({x:0,y:0});grid+=`<path d="M${origin.x} 0V${HEIGHT} M0 ${origin.y}H${WIDTH}" stroke="#d3deec" stroke-width="1.6"/>`;
 const edgeSvg=edges.map(e=>{const id=key(e.from,e.to),g=curve(e,proj);const active=activeKeys.has(id),sel=id===selectedEdge;const stroke=sel?'#4168d9':active?'#0f9b8d':'#8ba3ba',sw=sel?4.5:active?4:2.15,marker=sel?'net-arrow-selected':active?'net-arrow-active':'net-arrow';const show=showWeights||sel||active;return `<g data-edge-group="${esc(id)}"><path d="${g.path}" fill="none" stroke="#ffffff" stroke-width="11" opacity=".01" pointer-events="stroke" data-edge="${esc(id)}"/><path d="${g.path}" fill="none" stroke="${stroke}" stroke-width="${sw}" marker-end="url(#${marker})" pointer-events="none" opacity="${active||sel?1:.76}"/><title>${esc(e.from)} → ${esc(e.to)} · ${number(edgeLength(e))} unidades</title>${show?`<g pointer-events="none" transform="translate(${g.mx.toFixed(1)} ${g.my.toFixed(1)})"><rect x="-22" y="-10" width="44" height="20" rx="6" fill="#fff" stroke="${active?'#a8e2d7':'#e2e9f1'}"/><text x="0" y="4" font-size="10" font-weight="750" text-anchor="middle" fill="${active?'#0c9284':'#667b91'}">${number(edgeLength(e))}</text></g>`:''}</g>`}).join('');
 const nodeSvg=nodes.map(n=>{const p=proj.project(n),sel=selectedNode===n.id,highlight=activeNodes.has(n.id),fill=sel?'#4168d9':highlight?'#149d8c':'#fff',outline=sel?'#4168d9':highlight?'#159d8f':'#7fa0cb',font=sel||highlight?'white':'#355174';return `<g transform="translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="Seleccionar punto ${esc(n.id)}"><circle r="28" fill="#5077c7" opacity=".07"/><circle r="20" fill="${fill}" stroke="${outline}" stroke-width="${sel||highlight?3:2.2}"/><text y="5.6" text-anchor="middle" font-weight="850" font-size="15" fill="${font}" pointer-events="none">${esc(n.id)}</text><title>Punto ${esc(n.id)} (${number(n.x)}, ${number(n.y)})</title></g>`}).join('');
 stage.innerHTML=`<g transform="translate(${offsetX} ${offsetY}) scale(${zoom})"><g pointer-events="none">${grid}</g><g id="edges-layer">${edgeSvg}</g><g id="nodes-layer">${nodeSvg}</g></g>`;
 $('#graph-svg').classList.toggle('is-editing',editMode);}
function pointerSvg(e,svg){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function attachGraphEvents(){const svg=$('#graph-svg');let originPos=null;
 svg.addEventListener('pointerdown',e=>{const node=e.target.closest('[data-node]'),edge=e.target.closest('[data-edge]');if(e.button!==0)return;const pt=pointerSvg(e,svg);originPos=pt;if(node&&editMode){const n=getNode(node.dataset.node);if(!n)return;drag={type:'node',id:n.id,oldX:n.x,oldY:n.y,moved:false,start:pt};svg.setPointerCapture(e.pointerId)}else if(!node&&!edge){drag={type:'pan',start:pt,panX,panY};svg.classList.add('grabbing');svg.setPointerCapture(e.pointerId)}});
 svg.addEventListener('pointermove',e=>{if(!drag)return;const pt=pointerSvg(e,svg);if(drag.type==='pan'){panX=drag.panX+(pt.x-drag.start.x);panY=drag.panY+(pt.y-drag.start.y);drawGraph()}else if(drag.type==='node'){const n=getNode(drag.id);if(!n)return;const dx=(pt.x-drag.start.x)/zoom,dy=(pt.y-drag.start.y)/zoom;const pr=calcProjection();const movedX=dx/pr.scale,movedY=-dy/pr.scale;n.x=Math.round((drag.oldX+movedX)*10)/10;n.y=Math.round((drag.oldY+movedY)*10)/10;drag.moved=drag.moved||Math.hypot(dx,dy)>3;drawGraph()}});
 svg.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;svg.classList.remove('grabbing');try{svg.releasePointerCapture(e.pointerId)}catch(_e){}if(d.type==='node'){const n=getNode(d.id);if(d.moved&&(n.x!==d.oldX||n.y!==d.oldY)){const newX=n.x,newY=n.y;n.x=d.oldX;n.y=d.oldY;modify(()=>{n.x=newX;n.y=newY;route=null;routeSearched=false},'Posición actualizada')}else{selected={kind:'node',id:n.id};renderInspector();drawGraph()}}});
 svg.addEventListener('click',e=>{if(editMode)return;const nd=e.target.closest('[data-node]'),ed=e.target.closest('[data-edge]');if(nd){selected={kind:'node',id:nd.dataset.node};renderInspector();drawGraph()}else if(ed){selected={kind:'edge',id:ed.dataset.edge};renderInspector();drawGraph()}});
 svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-node]')){e.preventDefault();selected={kind:'node',id:e.target.closest('[data-node]').dataset.node};renderInspector();drawGraph()}});
 svg.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY<0?1.12:1/1.12;zoom=Math.min(4,Math.max(.55,zoom*factor));drawGraph()},{passive:false});
}
function renderMatrices(){const types=[['adyacencia','Adyacencia'],['directa','Distancia directa'],['geometrica','Distancia geométrica'],['minima','Rutas mínimas']];$('#content').innerHTML=`<section class="panel"><div class="panel-header"><div><div class="panel-heading">Explorador de matrices</div><div class="panel-caption">Selecciona una celda para consultar la relación entre dos puntos</div></div><div class="panel-tools"><button class="btn sm" id="matrix-export">${ic('download')} Exportar CSV</button></div></div><div style="padding:12px 16px;border-bottom:1px solid var(--line)"><div class="tabs" id="matrix-tabs">${types.map(([id,label])=>`<button class="tab ${matrixMode===id?'active':''}" data-matrix="${id}">${label}</button>`).join('')}</div></div><div class="table-scroll" id="matrix-host"></div><div class="map-footer" id="matrix-footer"></div></section>`;$('#matrix-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-matrix]');if(!b)return;matrixMode=b.dataset.matrix;renderMatrices()});$('#matrix-export').addEventListener('click',exportMatrix);drawMatrix();}
function matrixValue(a,b){if(matrixMode==='adyacencia')return edges.some(e=>e.from===a.id&&e.to===b.id)?1:0;if(matrixMode==='geometrica')return dist(a,b);if(matrixMode==='directa')return a.id===b.id?0:edges.some(e=>e.from===a.id&&e.to===b.id)?dist(a,b):Infinity;return shortest(a.id,b.id).distance}
function drawMatrix(){const s=sortedNodes();$('#matrix-host').innerHTML=`<table class="matrix"><thead><tr><th>Desde / Hacia</th>${s.map(n=>`<th>${esc(n.id)}</th>`).join('')}</tr></thead><tbody>${s.map(a=>`<tr><td>${esc(a.id)}</td>${s.map(b=>{const v=matrixValue(a,b),diag=a.id===b.id,finite=Number.isFinite(v);return `<td class="cell-click ${diag?'diagonal':''} ${matrixMode==='adyacencia'&&v===1?'matrix-on':''} ${!finite?'muted':''}" data-cell-from="${esc(a.id)}" data-cell-to="${esc(b.id)}" title="${esc(a.id)} → ${esc(b.id)}">${matrixMode==='adyacencia'?v:finite?number(v):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;const notes={adyacencia:'1 = conexión directa · 0 = sin conexión directa',directa:'— = no existe enlace directo en ese sentido',geometrica:'Distancia en línea recta, independiente de los enlaces',minima:'— = destino no alcanzable con los enlaces existentes'};$('#matrix-footer').innerHTML=`<span>${notes[matrixMode]}</span><span>${s.length} × ${s.length} elementos</span>`;
 $('#matrix-host').addEventListener('click',e=>{const cell=e.target.closest('[data-cell-from]');if(!cell)return;routeFrom=cell.dataset.cellFrom;routeTo=cell.dataset.cellTo;page='mapa';route=shortest(routeFrom,routeTo);routeSearched=true;selected=null;render()});}
function exportMatrix(){const s=sortedNodes();const rows=[['Desde / Hacia',...s.map(n=>n.id)],...s.map(a=>[a.id,...s.map(b=>{const v=matrixValue(a,b);return Number.isFinite(v)?matrixMode==='adyacencia'?v:v.toFixed(6):'INF'})])];download('nexo_matriz_'+matrixMode+'.csv',rows.map(r=>r.join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function renderConnections(){const options=`<option value="todos">Todos los orígenes</option>${sortedNodes().map(n=>`<option value="${esc(n.id)}" ${originFilter===n.id?'selected':''}>Punto ${esc(n.id)}</option>`).join('')}`;$('#content').innerHTML=`<section class="panel"><div class="panel-header"><div><div class="panel-heading">Directorio de conexiones</div><div class="panel-caption">${edges.length} enlaces configurados · Longitudes calculadas automáticamente</div></div><div class="panel-tools"><button class="btn primary sm" id="add-edge-table">${ic('plus')} Nueva conexión</button></div></div><div style="padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)"><div class="toolbar-filter"><input class="filter-input" id="edge-search" placeholder="Buscar A, B, A → B..." value="${esc(searchText)}" aria-label="Buscar conexiones"><select class="filter-select" id="edge-origin">${options}</select><select class="filter-select" id="edge-sort"><option value="origen" ${sortMode==='origen'?'selected':''}>Ordenar: origen</option><option value="menor" ${sortMode==='menor'?'selected':''}>Distancia: menor</option><option value="mayor" ${sortMode==='mayor'?'selected':''}>Distancia: mayor</option></select></div><span class="tag gray" id="edge-count"></span></div><div class="table-scroll" id="edges-table"></div></section>`;
 $('#add-edge-table').addEventListener('click',openEdgeModal);$('#edge-search').addEventListener('input',e=>{searchText=e.target.value;drawConnectionsTable()});$('#edge-origin').addEventListener('change',e=>{originFilter=e.target.value;drawConnectionsTable()});$('#edge-sort').addEventListener('change',e=>{sortMode=e.target.value;drawConnectionsTable()});drawConnectionsTable()}
function drawConnectionsTable(){let rows=edges.filter(e=>(originFilter==='todos'||e.from===originFilter)&&(e.from+' '+e.to+' '+e.from+' → '+e.to).toLowerCase().includes(searchText.toLowerCase().trim()));rows.sort((a,b)=>sortMode==='origen'?a.from.localeCompare(b.from)||a.to.localeCompare(b.to):sortMode==='menor'?edgeLength(a)-edgeLength(b):edgeLength(b)-edgeLength(a));$('#edge-count').textContent=`${rows.length} registros`;
 $('#edges-table').innerHTML=`<table class="data-table"><thead><tr><th>Origen</th><th>Destino</th><th>Distancia</th><th>Estado</th><th class="text-right">Acciones</th></tr></thead><tbody>${rows.length?rows.map(e=>`<tr><td><span class="node-mini">${esc(e.from)}</span> Punto ${esc(e.from)}</td><td><span class="node-mini">${esc(e.to)}</span> Punto ${esc(e.to)}</td><td><b>${number(edgeLength(e))}</b> unidades</td><td><span class="status-pill">Registrado</span></td><td class="text-right"><button class="btn sm" data-see-edge="${esc(key(e.from,e.to))}" title="Ver en mapa">${ic('map')} Ver</button> <button class="btn sm danger" data-delete-connection="${esc(key(e.from,e.to))}" title="Eliminar conexión">${ic('trash')}</button></td></tr>`).join(''):`<tr><td class="empty-row" colspan="5">No se encontraron conexiones con estos filtros.</td></tr>`}</tbody></table>`;
 $('#edges-table').addEventListener('click',e=>{const see=e.target.closest('[data-see-edge]'),del=e.target.closest('[data-delete-connection]');if(see){selected={kind:'edge',id:see.dataset.seeEdge};page='mapa';render()}if(del){const id=del.dataset.deleteConnection;askConfirm('Eliminar conexión',`Se eliminará el enlace ${id.replace('>',' → ')}.`,()=>modify(()=>{edges=edges.filter(o=>key(o.from,o.to)!==id);route=null;routeSearched=false},'Conexión eliminada'))}})}
function renderSummary(){const s=stat(),maxOut=Math.max(1,...nodes.map(n=>edges.filter(e=>e.from===n.id).length));$('#content').innerHTML=`<div class="sum-grid"><section class="panel"><div class="panel-header"><div><div class="panel-heading">Actividad por punto</div><div class="panel-caption">Conexiones salientes por nodo</div></div></div><div style="padding:20px 23px">${sortedNodes().map(n=>{const out=edges.filter(e=>e.from===n.id).length,inc=edges.filter(e=>e.to===n.id).length;return `<div class="activity-row"><div class="top"><span>Punto ${esc(n.id)}</span><small>${out} salientes · ${inc} entrantes</small></div><div class="bar-track"><div class="bar-fill" style="width:${out/maxOut*100}%"></div></div></div>`}).join('')}</div></section><section class="panel"><div class="panel-header"><div><div class="panel-heading">Estado de la red</div><div class="panel-caption">Indicadores calculados en tiempo real</div></div></div><div style="padding:20px 23px"><div class="mini-stat"><span>Conexiones posibles</span><b>${nodes.length*Math.max(0,nodes.length-1)}</b></div><div class="mini-stat"><span>Conexiones configuradas</span><b>${edges.length}</b></div><div class="mini-stat"><span>Densidad de red</span><b>${nodes.length>1?number(edges.length/(nodes.length*(nodes.length-1))*100):'0.00'} %</b></div><div class="mini-stat"><span>Relaciones alcanzables</span><b>${s.reachable} / ${nodes.length*(nodes.length-1)}</b></div><div class="mini-stat"><span>Distancia media por enlace</span><b>${edges.length?number(s.total/edges.length):'—'}</b></div><div class="mini-stat"><span>Nodos sin salida</span><b>${s.sinks.map(n=>n.id).join(', ')||'Ninguno'}</b></div><div class="mini-stat"><span>Tipo de red</span><b>Dirigida</b></div><button class="btn" style="width:100%;margin-top:12px" id="restore-network">${ic('undo')} Restaurar red de origen</button></div></section></div><section class="panel sub-panel"><div class="panel-header"><div><div class="panel-heading">Registro de puntos</div><div class="panel-caption">Coordenadas y grado de conectividad</div></div></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Punto</th><th>Coordenada X</th><th>Coordenada Y</th><th>Entrantes</th><th>Salientes</th><th>Estado</th></tr></thead><tbody>${sortedNodes().map(n=>{const out=edges.filter(e=>e.from===n.id).length,inc=edges.filter(e=>e.to===n.id).length;return `<tr><td><span class="node-mini">${esc(n.id)}</span> Punto ${esc(n.id)}</td><td>${number(n.x)}</td><td>${number(n.y)}</td><td>${inc}</td><td>${out}</td><td><span class="tag ${out?'':'orange'}">${out?'Con salida':'Sin salida'}</span></td></tr>`}).join('')}</tbody></table></div></section>`;
 $('#restore-network').addEventListener('click',()=>askConfirm('Restaurar red inicial','Se restablecerán los diez puntos y las 22 conexiones originales. Puedes deshacer esta acción.',()=>modify(()=>{nodes=copy(BASE_NODES);edges=copy(BASE_EDGES);selected=null;route=null;routeSearched=false;zoom=1;panX=panY=0},'Red original restaurada')))}
function openModal(title,description,body,actions){$('#modal-card').innerHTML=`<h2 id="modal-title">${esc(title)}</h2><p>${esc(description)}</p>${body}<div class="modal-buttons">${actions}</div>`;$('#modal-overlay').classList.add('show')}
function closeModal(){$('#modal-overlay').classList.remove('show');$('#modal-card').innerHTML=''}
function askConfirm(title,desc,onConfirm){openModal(title,desc,'',`<button class="btn" id="cancel-modal">Cancelar</button><button class="btn danger" id="confirm-modal">Confirmar</button>`);$('#cancel-modal').addEventListener('click',closeModal);$('#confirm-modal').addEventListener('click',()=>{closeModal();onConfirm()})}
function openNodeModal(){let seed='K';if(getNode(seed)){let i=1;while(getNode('N'+i))i++;seed='N'+i}openModal('Nuevo punto','Agrega un punto a la red. Después podrás crear sus conexiones.',`<form id="create-node-form"><div class="field"><label for="create-node-id">Identificador</label><input id="create-node-id" value="${esc(seed)}" maxlength="8" required placeholder="Ej. K" pattern="[A-Za-z0-9_-]{1,8}"></div><div class="fields-two"><div class="field"><label for="create-node-x">Posición X</label><input id="create-node-x" type="number" step="any" value="0" required></div><div class="field"><label for="create-node-y">Posición Y</label><input id="create-node-y" type="number" step="any" value="0" required></div></div></form>`,`<button class="btn" id="cancel-modal">Cancelar</button><button class="btn primary" id="create-node-btn">${ic('plus')} Crear punto</button>`);$('#cancel-modal').addEventListener('click',closeModal);$('#create-node-btn').addEventListener('click',()=>{const form=$('#create-node-form');if(!form.reportValidity())return;const id=$('#create-node-id').value.trim().toUpperCase(),x=Number($('#create-node-x').value),y=Number($('#create-node-y').value);if(getNode(id)){notify('Ese identificador ya existe','warn');return}if(!Number.isFinite(x)||!Number.isFinite(y)||Math.abs(x)>10000||Math.abs(y)>10000){notify('Coordenadas fuera de rango','warn');return}closeModal();modify(()=>{nodes.push({id,x,y});selected={kind:'node',id};page='mapa';route=null;routeSearched=false;zoom=1;panX=panY=0},'Punto creado')})}
function openEdgeModal(){if(nodes.length<2){notify('Debes tener al menos dos puntos','warn');return}openModal('Nueva conexión','Crea un enlace unidireccional entre dos puntos.',`<div class="fields-two"><div class="field"><label for="edge-new-from">Origen</label><select id="edge-new-from">${opt(sortedNodes()[0].id)}</select></div><div class="field"><label for="edge-new-to">Destino</label><select id="edge-new-to">${opt(sortedNodes()[1].id)}</select></div></div><div class="utility-note">La distancia se actualizará automáticamente según las coordenadas de ambos puntos.</div>`,`<button class="btn" id="cancel-modal">Cancelar</button><button class="btn primary" id="create-edge-btn">${ic('plus')} Crear conexión</button>`);$('#cancel-modal').addEventListener('click',closeModal);$('#create-edge-btn').addEventListener('click',()=>{const from=$('#edge-new-from').value,to=$('#edge-new-to').value;if(from===to){notify('Selecciona dos puntos diferentes','warn');return}if(edges.some(e=>e.from===from&&e.to===to)){notify('La conexión ya existe','warn');return}closeModal();modify(()=>{edges.push({from,to});selected={kind:'edge',id:key(from,to)};page='mapa';route=null;routeSearched=false},'Conexión creada')})}
initialize();
})();
